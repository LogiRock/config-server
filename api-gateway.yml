server:
  port: 8066

spring:
  cloud:
    gateway:
      server:
        webflux:
          # Sin rutas automáticas: solo se expone lo que está acá abajo
          discovery:
            locator:
              enabled: false
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:3000}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type
                allow-credentials: true
                max-age: 3600

          # Si algún servicio llegara a agregar sus propios headers CORS, queda uno solo
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

          routes:
            - id: shipment-service
              uri: lb://SHIPMENT-SERVICE
              predicates:
                - Path=/application/shipments/**
              filters:
                - RewritePath=/application/shipments/(?<segment>.*), /${segment}

            - id: courier-service
              uri: lb://COURIER-SERVICE
              predicates:
                - Path=/application/couriers/**
              filters:
                - RewritePath=/application/couriers/(?<segment>.*), /${segment}

            - id: security-service
              uri: lb://SECURITY-SERVICE
              predicates:
                - Path=/application/auth/**
              filters:
                - RewritePath=/application/auth/(?<segment>.*), /${segment}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only