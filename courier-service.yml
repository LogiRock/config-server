server:
  port: 8082

spring:
  application:
    name: courier-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/${DB_DATABASE_NAME:courier_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

security:
  service:
    url: ${SECURITY_SERVICE_URL:http://security-service:8081}